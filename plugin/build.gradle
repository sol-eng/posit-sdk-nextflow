plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.4.0'

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'posit'
    className = 'com.posit.nextflow.workbench.WorkbenchPlugin'
    extensionPoints = [
        'com.posit.nextflow.workbench.WorkbenchConfig',
        'com.posit.nextflow.workbench.WorkbenchExecutor',
        'com.posit.nextflow.workbench.WorkbenchEventsObserverFactory'
    ]
}

// Spock 2 runs on the JUnit Platform; Gradle 9 no longer picks a test framework by default
test {
    useJUnitPlatform()
}
