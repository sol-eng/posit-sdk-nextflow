[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "posit-workbench-nf-launcher"
version = "0.4.0"
description = "CLI that submits, lists and stops Posit Workbench Jobs, e.g. a headless Nextflow driver"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
posit-workbench-nf-launcher = "posit_workbench_nf_launcher.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]
